<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信群聊</title>
    <!-- 引入微信样式图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ededed;
            color: #111;
            /* 适配移动端动态底部状态栏 */
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 微信顶部导航栏 */
        .wx-header {
            background-color: #ededed;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #d8d8d8;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .wx-header .left, .wx-header .right {
            font-size: 16px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .wx-header .title {
            font-size: 16px;
            font-weight: 500;
        }

        /* 聊天主区域 */
        .chat-container {
            flex: 1;
            margin-top: 44px;
            margin-bottom: 55px;
            /* 增加底部 padding，让最后一条消息不会贴在最底部，预留出手机小白条位置 */
            padding: 15px 12px 40px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 消息行 */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            background-color: #ccc;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* 消息内容容器 */
        .message-content-group {
            display: flex;
            flex-direction: column;
            max-width: 75%; 
        }

        .nickname {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            margin-left: 2px;
        }

        .message-body-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ================= 语音气泡样式 ================= */
        .voice-bubble {
            background-color: #98e165;
            color: #000;
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            min-width: 80px; 
            max-width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: opacity 0.2s;
        }

        .voice-bubble:active {
            opacity: 0.8;
        }

        .voice-bubble::after {
            content: "";
            position: absolute;
            left: -6px;
            top: 14px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 6px solid #98e165;
        }

        .voice-icon {
            width: 18px;
            height: 18px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23000000"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .voice-bubble.playing .voice-icon {
            animation: waveAnim 1s infinite steps(3);
        }

        @keyframes waveAnim {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .voice-duration {
            font-size: 15px;
            color: #333;
        }

        /* ================= 纯文本气泡样式 ================= */
        .text-bubble {
            background-color: #fff;
            color: #333;
            padding: 10px 14px;
            border-radius: 6px;
            position: relative;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-all;
            white-space: pre-wrap; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .text-bubble::after {
            content: "";
            position: absolute;
            left: -6px;
            top: 14px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 6px solid #fff;
        }

        /* 转文字按钮 */
        .to-text-btn {
            font-size: 12px;
            color: #576b95;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            white-space: nowrap;
        }

        .to-text-btn:active {
            opacity: 0.6;
        }

        /* 转出的文字区域 - 无额外滑动冲突 */
        .transcribed-text {
            margin-top: 6px;
            font-size: 15px;
            color: #333;
            background-color: #f7f7f7;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
            display: none;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* 底部输入栏 */
        .wx-footer {
            background-color: #f7f7f7;
            height: 55px;
            border-top: 1px solid #d8d8d8;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .wx-footer i {
            font-size: 26px;
            color: #5b5b5b;
        }

        .wx-footer .input-box {
            flex: 1;
            height: 38px;
            background-color: #fff;
            border-radius: 6px;
            border: 1px solid #d8d8d8;
        }
    </style>
</head>
<body>

    <div class="wx-header">
        <div class="left">
            <i class="fa-solid fa-angle-left"></i>
            <span>微信 (5)</span>
        </div>
        <div class="title">大家都是好朋友哇(5)</div>
        <div class="right">
            <i class="fa-solid fa-ellipsis"></i>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- 动态生成的消息 -->
    </div>

    <div class="wx-footer">
        <i class="fa-regular fa-face-smile"></i>
        <div class="input-box"></div>
        <i class="fa-regular fa-square-plus"></i>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const chatData = [
            {
                type: "voice",
                name: "连世疆",
                avatar: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/lian.jpg",
                duration: "6''",
                audioUrl: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/l1.mp4",
                text: "阿黎，我都听你的。"
            },
            {
                type: "voice",
                name: "卫子谣",
                avatar: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/xw.jpg",
                duration: "13''",
                audioUrl: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/xw.mp4",
                text: "姐姐，太傅又要考试啦，这次还把我们两个人分到了不同的房间，那不然你有不会的就去问连世子吧，虽然他也挺不靠谱儿的。"
            },
            {
                type: "voice",
                name: "连世疆",
                avatar: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/lian.jpg",
                duration: "4''",
                audioUrl: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/l2.mp4",
                text: "阿黎，我是自愿挨打的。"
            },
            {
                type: "text",
                name: "袁玠",
                avatar: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/yj.jpg",
                text: "哈哈，爱妃爱卿们的友谊真是深厚，朕看了也高兴，不如全纳了进来，让朕与民同乐。"
            },
            {
                type: "voice",
                name: "李文瑙",
                avatar: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/li.jpg",
                duration: "17''",
                audioUrl: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/li.mp4",
                text: "殿下这可真是高情商发言啊，无妨无妨，我们怎么敢跟殿下较真呢？弟媳，你在家里跟子谣好好待着，跟我弟弟呢，把日子过好，我去一趟皇宫。今晚不用等我回来吃饭了。"
            },
            {
                type: "voice",
                name: "连世疆",
                avatar: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/lian.jpg",
                duration: "11''",
                audioUrl: "https://raw.githubusercontent.com/miancha/Sophyjubensha/refs/heads/main/l3.mp4",
                text: "阿黎，我都、哥？阿黎，你等一下，我都听你的。"
            }
        ];

        const chatContainer = document.getElementById('chatContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        
        let currentPlayingBubble = null;

        function loadMessages() {
            chatData.forEach((item, index) => {
                setTimeout(() => {
                    const row = document.createElement('div');
                    row.className = 'message-row';
                    
                    let messageBodyHtml = '';

                    if (item.type === 'voice') {
                        const durationSec = parseInt(item.duration) || 2;
                        const dynamicWidth = Math.min(260, 100 + durationSec * 6);

                        messageBodyHtml = `
                            <div class="message-body-wrapper">
                                <div class="voice-bubble" data-audio="${item.audioUrl}" style="width: ${dynamicWidth}px;">
                                    <div class="voice-icon"></div>
                                    <span class="voice-duration">${item.duration}</span>
                                </div>
                                <button class="to-text-btn">转文字</button>
                            </div>
                            <div class="transcribed-text" data-text="${item.text}"></div>
                        `;
                    } else if (item.type === 'text') {
                        messageBodyHtml = `
                            <div class="message-body-wrapper">
                                <div class="text-bubble">${item.text}</div>
                            </div>
                        `;
                    }
                    
                    row.innerHTML = `
                        <img src="${item.avatar}" class="avatar" alt="avatar">
                        <div class="message-content-group">
                            <span class="nickname">${item.name}</span>
                            ${messageBodyHtml}
                        </div>
                    `;

                    chatContainer.appendChild(row);
                    chatContainer.scrollTop = chatContainer.scrollHeight;

                    if (item.type === 'voice') {
                        initMessageEvents(row);
                    }

                }, index * 1000); 
            });
        }

        function initMessageEvents(row) {
            const bubble = row.querySelector('.voice-bubble');
            const toTextBtn = row.querySelector('.to-text-btn');
            const transcribedBox = row.querySelector('.transcribed-text');
            
            if (!bubble || !toTextBtn || !transcribedBox) return;

            const audioUrl = bubble.getAttribute('data-audio');

            // 1. 点击播放/暂停
            bubble.addEventListener('click', () => {
                if (currentPlayingBubble === bubble) {
                    audioPlayer.pause();
                    bubble.classList.remove('playing');
                    currentPlayingBubble = null;
                } else {
                    if (currentPlayingBubble) {
                        currentPlayingBubble.classList.remove('playing');
                    }
                    audioPlayer.src = audioUrl;
                    audioPlayer.play().catch(e => console.log("请手动点击", e));
                    bubble.classList.add('playing');
                    currentPlayingBubble = bubble;
                }
            });

            audioPlayer.addEventListener('ended', () => {
                if (currentPlayingBubble) {
                    currentPlayingBubble.classList.remove('playing');
                    currentPlayingBubble = null;
                }
            });

            // 2. 点击转文字
            toTextBtn.addEventListener('click', () => {
                // 如果当前是展开状态，则隐藏
                if (transcribedBox.style.display === 'block') {
                    transcribedBox.style.display = 'none';
                    transcribedBox.textContent = ''; // 清空内容
                    return;
                }

                // 否则，直接显示全文
                const fullText = transcribedBox.getAttribute('data-text');
                transcribedBox.style.display = 'block';
                transcribedBox.textContent = fullText;
                
                // 平滑滚动到底部，确保内容进入可视区（仅滚动一次）
                setTimeout(() => {
                    chatContainer.scrollTo({
                        top: chatContainer.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 50);
            });
        }

        window.onload = () => {
            loadMessages();
        };
    </script>
</body>
</html>
